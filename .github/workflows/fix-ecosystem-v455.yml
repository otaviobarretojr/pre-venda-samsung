name: PRE VENDA ecosystem v4.5.5
on:
  push:
    paths:
      - '.github/workflows/fix-ecosystem-v455.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject ecosystem loader directly into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script src="\./dual-lines\.js[^>]*></script>', '', s)
          s = re.sub(r'<script src="\./ecosystem-v454\.js[^>]*></script>', '', s)
          s = s.replace('</body>', '<script src="./ecosystem-v454.js?v=4.5.5"></script>\n</body>')
          s = s.replace('PRE VENDA • v4.5.4', 'PRE VENDA • v4.5.5')
          s = s.replace('PRE VENDA • v4.5.3', 'PRE VENDA • v4.5.5')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'ecosystem-v454.js?v=4.5.5' index.html
          grep -q 'Ecossistema' ecosystem-v454.js
          grep -q 'wearableColor' ecosystem-v454.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: load ecosystem section directly in form" || exit 0
          git push
