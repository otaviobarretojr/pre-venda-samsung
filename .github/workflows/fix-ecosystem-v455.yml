name: PRE VENDA ecosystem v4.5.5
on:
  push:
    paths:
      - '.github/workflows/fix-ecosystem-v455.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject ecosystem directly and simplify service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # remove any previous external ecosystem/dual-line loaders to avoid duplicates
          import re
          s=re.sub(r'<script src="\./dual-lines\.js[^>]*></script>','',s)
          s=re.sub(r'<script src="\./ecosystem-v454\.js[^>]*></script>','',s)
          # load ecosystem directly from HTML, independent of service worker
          s=s.replace('</body>','<script src="./ecosystem-v454.js?v=4.5.5"></script>\n</body>')
          s=s.replace('PRE VENDA • v4.5.4','PRE VENDA • v4.5.5')
          s=s.replace('PRE VENDA • v4.5.3','PRE VENDA • v4.5.5')
          p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          sw.write_text("""const CACHE_NAME = 'pre-venda-samsung-v4-5-5';
const APP_SHELL = ['./','./index.html','./ecosystem-v454.js','./manifest.webmanifest','./icon-192.png','./icon-512.png'];
self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(APP_SHELL)));self.skipWaiting();});
self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE_NAME).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',event=>{const req=event.request;if(req.method!=='GET')return;const url=new URL(req.url);if(url.hostname.includes('supabase.co')){event.respondWith(fetch(req));return;}if(req.mode==='navigate'){event.respondWith(fetch(req,{cache:'no-store'}).then(r=>{const c=r.clone();caches.open(CACHE_NAME).then(cache=>cache.put('./index.html',c));return r;}).catch(()=>caches.match('./index.html')));return;}event.respondWith(fetch(req,{cache:'no-store'}).then(r=>{if(r.ok&&url.origin===self.location.origin){const c=r.clone();caches.open(CACHE_NAME).then(cache=>cache.put(req,c));}return r;}).catch(()=>caches.match(req)));});
""",encoding='utf-8')
          PY
      - name: Sanity checks
        run: |
          grep -q 'ecosystem-v454.js?v=4.5.5' index.html
          grep -q "pre-venda-samsung-v4-5-5" service-worker.js
          grep -q 'Ecossistema' ecosystem-v454.js
          grep -q 'wearableColor' ecosystem-v454.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "fix: load ecosystem section directly in form" || exit 0
          git push
