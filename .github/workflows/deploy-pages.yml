name: Deploy Pré-Venda Samsung
on:
  push:
    branches: [main]
    paths-ignore: [verified-production.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V8.2.1 stable
        run: |
          node --check v741-deploy-guard.js
          node --check v81-abastecimento.js
          node --check v82-supply-online.js
          node --check v71-config.js
          node --check v71-self-test.js
          node --check v7-release.js
          node --check scripts/verify-production.mjs
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.2.1'||v.channel!=='stable'||v.published!==true||v.authentication!==false)throw Error('Manifesto inválido');
          if(v.stableBase!=='8.2.0'||h.version!==v.version)throw Error('base/health divergente');
          const m=fs.readFileSync('v81-abastecimento.js','utf8');if(!m.includes('ensureEnterpriseNav')||!m.includes('data-panel="supplyPanel"'))throw Error('menu Abastecimento ausente');
          NODE
  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published URL
        env:
          PRODUCTION_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: 8.2.1
        run: node scripts/verify-production.mjs
      - name: Persist verified production proof
        uses: actions/github-script@v7
        env:
          PRODUCTION_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path='verified-production.json';
            let sha;
            try { const current=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'}); sha=current.data.sha; } catch(e) { if(e.status!==404) throw e; }
            const payload={version:'8.2.1',status:'verified',canonicalHost:process.env.PRODUCTION_URL,verifiedAt:new Date().toISOString(),commit:context.sha};
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'ci: record verified V8.2.1 production [skip deploy]',content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),sha,branch:'main'});
