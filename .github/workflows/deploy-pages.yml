name: Deploy Pre-Venda Samsung
on:
  push:
    branches: [main]
    paths-ignore: [verified-production.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V8.6.4 stable
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json'));const h=JSON.parse(fs.readFileSync('health.json'));if(v.version!=='8.6.4'||v.stableBase!=='8.6.3'||h.version!=='8.6.4')process.exit(1);if(!h.requiredModules.includes('v864-supply-clean.js')||!h.requiredTables.includes('manual_stock'))process.exit(1)"
  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published URL
        env:
          PRODUCTION_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_VERSION: 8.6.4
        run: node scripts/verify-production.mjs
      - name: Persist production proof
        uses: actions/github-script@v7
        env:
          PRODUCTION_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path='verified-production.json'; let sha;
            try { sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'})).data.sha; } catch(e) { if(e.status!==404) throw e; }
            const payload={version:'8.6.4',status:'verified',canonicalHost:process.env.PRODUCTION_URL,verifiedAt:new Date().toISOString(),commit:context.sha};
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'ci: record verified V8.6.4 production [skip deploy]',content:Buffer.from(JSON.stringify(payload,null,2)+'\n').toString('base64'),sha,branch:'main'});
