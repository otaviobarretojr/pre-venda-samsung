name: PRE VENDA print date v4.5.6
on:
  push:
    paths:
      - '.github/workflows/print-date-v456.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate print date and bump cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="pv-date">Data: <strong id="docDatePayment">—</strong></div>','')
          s=s.replace("byId('docData').textContent=date;byId('docDatePayment').textContent=date;","byId('docData').textContent=date;")
          s=s.replace('ecosystem-v454.js?v=4.5.5','ecosystem-v454.js?v=4.5.6')
          s=s.replace('PRE VENDA • v4.5.5','PRE VENDA • v4.5.6')
          p.write_text(s,encoding='utf-8')
          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8').replace('pre-venda-samsung-v4-5-5','pre-venda-samsung-v4-5-6')
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Validate
        run: |
          ! grep -q 'docDatePayment' index.html
          grep -q 'ecosystem-v454.js?v=4.5.6' index.html
          grep -q 'pre-venda-samsung-v4-5-6' service-worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "fix: keep one date on printed declaration" || exit 0
          git push
