name: V8.6.3 Delivery Click Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: V8.6.3 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.6.3'||v.stableBase!=='8.6.2'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v861-delivery-close.js','utf8');for(const x of ['bindDelegatedClick','type="button"','saving=new Set','data-v861-deliver','O servidor não confirmou'])if(!m.includes(x))throw Error('hotfix de clique incompleto '+x);
          const s=fs.readFileSync('scripts/full-inspection.mjs','utf8');for(const x of ['delivery-click-status','delivery-click-badge','page.route'])if(!s.includes(x))throw Error('teste de clique incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-6-3'))throw Error('cache divergente');
          if(h.version!=='8.6.3'||!h.requiredModules.includes('v861-delivery-close.js'))throw Error('health divergente');
          NODE
