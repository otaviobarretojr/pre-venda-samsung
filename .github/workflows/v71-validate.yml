name: V8.2.3 HTML Inventory Hotfix Validation
on:
  push:
    branches: [v8.2.3-html-inventory-hotfix]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v741-deploy-guard.js
          node --check v81-abastecimento.js
          node --check v82-supply-online.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V8.2.3 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.2.3'||v.stableBase!=='8.2.2'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v81-abastecimento.js','utf8');for(const x of ['parseHtmlInventory','tabelaRegistroInventario','DOMParser','fileInput.onchange'])if(!m.includes(x))throw Error('parser HTML incompleto '+x);
          const t=fs.readFileSync('v71-self-test.js','utf8');if(!t.includes('html-inventory-parser'))throw Error('teste parser HTML ausente');
          const sw=fs.readFileSync('service-worker.js','utf8');if(!sw.includes('pre-venda-samsung-v8-2-3'))throw Error('cache divergente');
          if(h.version!=='8.2.3')throw Error('health divergente');
          NODE
