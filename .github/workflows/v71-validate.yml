name: V7.4 Operations Polish Validation
on:
  push:
    branches: [v7.4-operations-polish]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v71-data.js
          node --check v71-budget-import.js
          node --check v71-integration.js
          node --check v711-stability.js
          node --check v72-core.js
          node --check v73-operations.js
          node --check v74-polish.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V7.4 contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='7.4.0'||v.channel!=='stable'||v.published!==true||v.authentication!==false)throw Error('release inválida');
          if(v.stableBase!=='7.3.0'||v.dataArchitecture!==4)throw Error('base/arquitetura divergente');
          for(const f of ['v72-core.js','v73-operations.js','v74-polish.js'])if(!fs.existsSync(f))throw Error('módulo ausente '+f);
          for(const t of ['audit_events','commercial_stages'])if(!h.requiredTables.includes(t))throw Error('tabela ausente '+t);
          const polish=fs.readFileSync('v74-polish.js','utf8');for(const x of ['Pendentes +72h','Ranking comercial','Exportar pipeline CSV','v74AuditSearch'])if(!polish.includes(x))throw Error('recurso ausente '+x);
          const sw=fs.readFileSync('service-worker.js','utf8');if(!sw.includes('pre-venda-samsung-v7-4-0')||!sw.includes('v74-polish.js'))throw Error('cache divergente');
          NODE
      - name: Stable base protection
        run: |
          grep -q "stableBase:'7.3.0'" v71-config.js
          grep -q "STABLE_BASE='7.3.0'" v7-release.js
          test -f supabase-online-setup.sql
