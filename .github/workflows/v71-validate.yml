name: V7.2 Consolidation Validation
on:
  push:
    branches: [v7.2-consolidation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v71-data.js
          node --check v71-budget-import.js
          node --check v71-integration.js
          node --check v711-stability.js
          node --check v72-core.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V7.2 contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='7.2.0'||v.channel!=='stable'||v.published!==true) throw Error('release inválida');
          if(v.stableBase!=='7.1.1'||v.dataArchitecture!==3) throw Error('base/arquitetura divergente');
          for(const f of ['v71-config.js','v71-data.js','v71-integration.js','v711-stability.js','v72-core.js','v71-self-test.js','supabase-v72-migration.sql']) if(!fs.existsSync(f)) throw Error('módulo ausente '+f);
          for(const t of ['sync_tombstones','data_backups','sync_events']) if(!h.requiredTables.includes(t)) throw Error('tabela V7.2 ausente '+t);
          const rel=fs.readFileSync('v7-release.js','utf8');if(!rel.includes("RELEASE='7.2.0'")||!rel.includes('v72-core.js'))throw Error('loader divergente');
          const sw=fs.readFileSync('service-worker.js','utf8');if(!sw.includes('pre-venda-samsung-v7-2-0')||!sw.includes('v72-core.js'))throw Error('cache divergente');
          const core=fs.readFileSync('v72-core.js','utf8');for(const x of ['sync_tombstones','data_backups','preVendaV72Queue','before-delete'])if(!core.includes(x))throw Error('proteção ausente '+x);
          const sql=fs.readFileSync('supabase-v72-migration.sql','utf8');if(/drop\s+table|truncate\s+table/i.test(sql))throw Error('migração destrutiva');
          NODE
      - name: Stable base protection
        run: |
          grep -q "stableBase:'7.1.1'" v71-config.js
          grep -q "STABLE_BASE='7.1.1'" v7-release.js
          test -f supabase-online-setup.sql
