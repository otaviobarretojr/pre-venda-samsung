name: V8.6.1 Delivery Close Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: V8.6.1 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.6.1'||v.stableBase!=='8.6.0'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v861-delivery-close.js','utf8');for(const x of ['data-v861-deliver','v861DeliveryChart','status_venda:DELIVERED','retirado_at:now','presale:delivered'])if(!m.includes(x))throw Error('entrega final incompleta '+x);
          const s=fs.readFileSync('v71-self-test.js','utf8');for(const x of ['history-delivery-control','legacy-status-hidden','delivery-chart'])if(!s.includes(x))throw Error('self-test incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-6-1'))throw Error('cache divergente');
          if(h.version!=='8.6.1'||!h.requiredModules.includes('v861-delivery-close.js'))throw Error('health divergente');
          NODE
