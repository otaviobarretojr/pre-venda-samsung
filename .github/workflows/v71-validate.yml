name: V7.3 Operations Validation
on:
  push:
    branches: [v7.3-ops-no-auth]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v71-data.js
          node --check v71-budget-import.js
          node --check v71-integration.js
          node --check v711-stability.js
          node --check v72-core.js
          node --check v73-operations.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V7.3 contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='7.3.0'||v.channel!=='stable'||v.published!==true||v.authentication!==false) throw Error('release inválida');
          if(v.stableBase!=='7.2.0'||v.dataArchitecture!==4) throw Error('base/arquitetura divergente');
          for(const f of ['v72-core.js','v73-operations.js','supabase-v73-migration.sql']) if(!fs.existsSync(f)) throw Error('módulo ausente '+f);
          for(const t of ['audit_events','commercial_stages']) if(!h.requiredTables.includes(t)) throw Error('tabela V7.3 ausente '+t);
          const ops=fs.readFileSync('v73-operations.js','utf8');for(const x of ['audit_events','commercial_stages','Faturada','Cancelada','V73_COMPATIBILITY'])if(!ops.includes(x))throw Error('operações incompletas '+x);
          const sw=fs.readFileSync('service-worker.js','utf8');if(!sw.includes('pre-venda-samsung-v7-3-0')||!sw.includes('v73-operations.js'))throw Error('cache divergente');
          const sql=fs.readFileSync('supabase-v73-migration.sql','utf8');if(/drop\s+table|truncate\s+table/i.test(sql))throw Error('migração destrutiva');
          NODE
      - name: Stable base protection
        run: |
          grep -q "stableBase:'7.2.0'" v71-config.js
          grep -q "STABLE_BASE='7.2.0'" v7-release.js
          test -f supabase-online-setup.sql
