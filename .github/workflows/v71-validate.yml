name: V8.4 Presale History Validation
on:
  push:
    branches: [v8.4-history-presale-only]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v741-deploy-guard.js
          node --check v81-abastecimento.js
          node --check v82-supply-online.js
          node --check v84-history.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V8.4 history contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.4.0'||v.stableBase!=='8.3.0'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v84-history.js','utf8');
          for(const x of ['removeBudgetHistory','budgetSave','Histórico de Pré-vendas','v84HistoryKpis','v84QuickFilters','Exportar pré-vendas'])if(!m.includes(x))throw Error('histórico incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-4-0'))throw Error('cache divergente');
          if(h.version!=='8.4.0'||!h.requiredModules.includes('v84-history.js'))throw Error('health divergente');
          NODE
