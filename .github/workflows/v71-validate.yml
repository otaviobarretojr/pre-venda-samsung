name: V7.1 Infrastructure Validation
on:
  push:
    branches: [v7.1-infrastructure, v7.1-stable-release]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v71-data.js
          node --check v71-budget-import.js
          node --check v71-integration.js
          node --check v71-self-test.js
          node --check v7-release.js
          node --check ecosystem-v454.js
          node --check v5.js
          node --check budget-v570.js
          node --check budget-history-v600.js
      - name: V7.1 architecture contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const health=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='7.1.0'||v.channel!=='stable'||v.published!==true) throw Error('version.json não é V7.1 estável');
          if(health.version!==v.version||health.channel!=='stable') throw Error('health.json divergente');
          const sql=fs.readFileSync('supabase-v71-migration.sql','utf8');
          for(const t of ['budgets','budget_catalog','ecosystem_catalog','release_versions']) if(!sql.includes(`public.${t}`)) throw Error(`Tabela ausente: ${t}`);
          if(/drop\s+table|truncate\s+table/i.test(sql)) throw Error('Migração destrutiva não permitida');
          const cfg=fs.readFileSync('v71-config.js','utf8');
          for(const t of ['pre_vendas','budgets','budget_catalog','ecosystem_catalog']) if(!cfg.includes(t)) throw Error(`Base não separada: ${t}`);
          const release=fs.readFileSync('v7-release.js','utf8');
          if(!release.includes(`RELEASE='${v.version}'`)) throw Error('v7-release.js e version.json divergentes');
          if(!release.includes('v71-self-test.js')) throw Error('Autoteste V7.1 não carregado');
          const integration=fs.readFileSync('v71-integration.js','utf8');
          if(!integration.includes('V71BudgetImport')) throw Error('Importação de preços não integrada');
          if(!integration.includes("LEGACY_BUDGET_KEY='samsung_saved_budgets_v1'")) throw Error('Fallback legado ausente');
          NODE
      - name: Stable protection
        run: |
          grep -q "stableBase:'7.0.2'" v71-config.js
          grep -q "STABLE_BASE='7.0.2'" v7-release.js
          grep -q 'pre-venda-samsung-v7-1-0' service-worker.js
          test -f supabase-online-setup.sql
