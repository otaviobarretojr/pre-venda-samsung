name: V8.5.1 History Status Validation
on:
  push:
    branches: [v8.5.1-history-status]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v741-deploy-guard.js
          node --check v81-abastecimento.js
          node --check v82-supply-online.js
          node --check v84-history.js
          node --check v85-supply-ui.js
          node --check v851-history-status.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V8.5.1 history status contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.5.1'||v.stableBase!=='8.5.0'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v851-history-status.js','utf8');
          for(const x of ['Aguardando produto','Cliente avisado','Retirado','statusVenda','clienteAvisadoAt','retiradoAt','data-v851-status','upsertHistory'])if(!m.includes(x))throw Error('status de histórico incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-5-1'))throw Error('cache divergente');
          if(h.version!=='8.5.1'||!h.requiredModules.includes('v851-history-status.js'))throw Error('health divergente');
          NODE
