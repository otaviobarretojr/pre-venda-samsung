name: V8.6.2 Supply Sorting Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: V8.6.2 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.6.2'||v.stableBase!=='8.6.1'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v862-supply-sorting.js','utf8');for(const x of ['v862SortField','v862SortDir','Crescente','Decrescente','balance','stock'])if(!m.includes(x))throw Error('ordenação incompleta '+x);
          const s=fs.readFileSync('v71-self-test.js','utf8');for(const x of ['supply-sort-field','supply-sort-direction'])if(!s.includes(x))throw Error('self-test incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-6-2'))throw Error('cache divergente');
          if(h.version!=='8.6.2'||!h.requiredModules.includes('v862-supply-sorting.js'))throw Error('health divergente');
          NODE
