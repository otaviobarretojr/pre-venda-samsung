name: V8.0 Operations Maturity Validation
on:
  push:
    branches: [v8.0-operations-maturity]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v71-data.js
          node --check v71-budget-import.js
          node --check v71-integration.js
          node --check v711-stability.js
          node --check v72-core.js
          node --check v73-operations.js
          node --check v74-polish.js
          node --check v741-deploy-guard.js
          node --check v80-maturity.js
          node --check v71-self-test.js
          node --check v7-release.js
          node --check scripts/verify-production.mjs
      - name: V8.0 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.0.0'||v.channel!=='stable'||v.published!==true||v.authentication!==false)throw Error('release inválida');
          if(v.stableBase!=='7.4.1'||v.dataArchitecture!==4)throw Error('base/arquitetura divergente');
          if(v.canonicalHost!=='https://otaviobarretojr.github.io/pre-venda-samsung/')throw Error('host canônico inválido');
          for(const f of ['v741-deploy-guard.js','v80-maturity.js','scripts/verify-production.mjs'])if(!fs.existsSync(f))throw Error('arquivo ausente '+f);
          const m=fs.readFileSync('v80-maturity.js','utf8');for(const x of ['Saúde do sistema','Qualidade operacional','Possíveis duplicidades','Sem avanço +72h'])if(!m.includes(x))throw Error('maturity incompleta '+x);
          const sw=fs.readFileSync('service-worker.js','utf8');if(!sw.includes('pre-venda-samsung-v8-0-0')||!sw.includes('v80-maturity.js'))throw Error('cache divergente');
          if(!h.requiredModules.includes('v80-maturity.js'))throw Error('health incompleto');
          NODE
      - name: Stable base protection
        run: |
          grep -q "stableBase:'7.4.1'" v71-config.js
          grep -q "STABLE_BASE='7.4.1'" v7-release.js
          test -f supabase-online-setup.sql
