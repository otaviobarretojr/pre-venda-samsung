name: V8.6.0 Manual Stock Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: V8.6.0 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.6.0'||v.stableBase!=='8.5.3'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v860-supply-dashboard.js','utf8');for(const x of ['manual_stock','Aguardando produto','Cliente avisado','Retirado','data-stock','v860Products'])if(!m.includes(x))throw Error('abastecimento incompleto '+x);
          const s=fs.readFileSync('v71-self-test.js','utf8');for(const x of ['manual-stock-dashboard','supply-stock-input','supply-product-filter'])if(!s.includes(x))throw Error('self-test incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-6-0'))throw Error('cache divergente');
          if(h.version!=='8.6.0'||!h.requiredModules.includes('v860-supply-dashboard.js')||!h.requiredTables.includes('manual_stock'))throw Error('health divergente');
          NODE
