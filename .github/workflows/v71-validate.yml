name: V8.6.4 Clean Supply Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: V8.6.4 contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='8.6.4'||v.stableBase!=='8.6.3'||v.channel!=='stable'||v.published!==true)throw Error('release inválida');
          const m=fs.readFileSync('v864-supply-clean.js','utf8');for(const x of ['Pré-vendas','Entregues','Saldo disponível','data-v864-stock','v864Products','v864SortField','v864SortDir'])if(!m.includes(x))throw Error('dashboard incompleto '+x);
          if(!fs.readFileSync('service-worker.js','utf8').includes('pre-venda-samsung-v8-6-4'))throw Error('cache divergente');
          if(h.version!=='8.6.4'||!h.requiredModules.includes('v864-supply-clean.js'))throw Error('health divergente');
          NODE
