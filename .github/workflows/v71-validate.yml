name: V7.1 Stability Validation
on:
  push:
    branches: [v7.1.1-stability-sync]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v71-config.js
          node --check v71-data.js
          node --check v71-budget-import.js
          node --check v71-integration.js
          node --check v711-stability.js
          node --check v71-self-test.js
          node --check v7-release.js
      - name: V7.1.1 contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(v.version!=='7.1.1'||v.channel!=='stable'||v.published!==true) throw Error('release inválida');
          if(h.version!==v.version||!h.requiredModules.includes('v711-stability.js')) throw Error('health divergente');
          for(const f of ['v71-config.js','v71-data.js','v71-integration.js','v711-stability.js','v71-self-test.js']) if(!fs.existsSync(f)) throw Error('módulo ausente '+f);
          const rel=fs.readFileSync('v7-release.js','utf8');if(!rel.includes("RELEASE='7.1.1'")||!rel.includes('v711-stability.js'))throw Error('loader divergente');
          const sw=fs.readFileSync('service-worker.js','utf8');if(!sw.includes('pre-venda-samsung-v7-1-1')||!sw.includes('v711-stability.js'))throw Error('cache divergente');
          const data=fs.readFileSync('v71-data.js','utf8');if(!data.includes('AbortController')||!data.includes('BroadcastChannel'))throw Error('resiliência de sync ausente');
          NODE
      - name: Stable base protection
        run: |
          grep -q "stableBase:'7.0.2'" v71-config.js
          grep -q "STABLE_BASE='7.0.2'" v7-release.js
          test -f supabase-online-setup.sql
