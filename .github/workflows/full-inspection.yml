name: Full V8.6.0 Inspection
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax sweep
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pre-sale-server.log 2>&1 &
          sleep 2
      - name: Browser inspection
        run: node scripts/full-inspection.mjs
